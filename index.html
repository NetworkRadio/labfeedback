<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>How was your visit?</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#FFF6F2;color:#3B2A20;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:light}
.wrap{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:20px 20px 28px;display:flex;flex-direction:column}
.scr{display:flex;flex-direction:column;flex:1;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.scr,.ok{animation:none}.bar i,.nb,.fc{transition:none}}
h1,h2{margin:0 0 8px;font-weight:600;line-height:1.25;color:#3B2A20}
h1{font-size:30px}h2{font-size:22px}
p{margin:0}
button,#trk{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.sub{font-size:16px;line-height:1.5;color:#7A5F4D}
.small{font-size:12px;color:#7A5F4D}
.brand{text-align:center;font-size:16px;font-weight:600;letter-spacing:.2px;margin:0 0 8px;color:#3B2A20}
.tb{background:#FFE3DE;color:#3B2A20;font-size:12px;text-align:center;padding:7px 10px;border-radius:8px;margin-bottom:12px;line-height:1.35}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.mid.c{align-items:center;text-align:center}
.ico{width:56px;height:56px;border-radius:16px;background:#FFE3DE;display:flex;align-items:center;justify-content:center}
.circ{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ok{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.pill{width:100%;min-height:54px;border:none;border-radius:14px;background:#FF6F61;color:#3B2A20;font:inherit;font-size:17px;font-weight:600;cursor:pointer;margin-top:auto;transition:background .15s,transform .1s}
.pill:active{transform:scale(.98);background:#F85F50}
.hd{margin-bottom:22px}
.hrow{display:flex;align-items:center;gap:10px;font-size:13px;color:#7A5F4D;margin-bottom:8px;min-height:28px}
.hrow .lab{flex:1}
.bk{background:none;border:none;padding:6px;margin:-6px 0 -6px -6px;cursor:pointer;display:flex;align-items:center;color:#3B2A20;border-radius:8px}
.bar{height:6px;background:#FADAD3;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#FF6F61;border-radius:3px;transition:width .4s ease}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:22px}
.nb{min-height:50px;width:100%;border-radius:12px;border:1.5px solid #F2CFC8;background:#fff;color:#3B2A20;font:inherit;font-size:17px;font-weight:600;cursor:pointer;padding:0;transition:transform .15s,background .15s}
.nb.on{background:#FF6F61;border-color:#FF6F61;transform:scale(1.08)}
.ends{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#7A5F4D;margin-top:12px}
.faces{display:flex;justify-content:space-between;margin-top:36px}
.fc{background:none;border:none;padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s;width:19%;font:inherit}
.fc.on{transform:scale(1.15)}
.fc span{font-size:12px;color:#7A5F4D}
#trk{position:relative;height:104px;margin-top:30px;touch-action:none !important;cursor:pointer;outline:none}
#trk:focus-visible{box-shadow:0 0 0 2px #FF6F61;border-radius:8px}
.tl{position:absolute;left:32px;right:32px;top:22px;height:4px;background:#FADAD3;border-radius:2px}
.tf{position:absolute;left:32px;top:22px;height:4px;background:#FF6F61;border-radius:2px;width:0}
.td{position:absolute;top:18px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#F2CFC8}
.td.on{background:#FF6F61}
.tt{position:absolute;top:11px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#FF6F61;border:3px solid #fff;display:none;box-shadow:0 1px 4px rgba(59,42,32,.25)}
.lbl{position:absolute;top:50px;width:58px;margin-left:-29px;text-align:center;font-size:12px;line-height:1.3;color:#7A5F4D}
.lbl.on{color:#D9483A;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{min-height:44px;padding:10px 16px;border-radius:22px;border:1.5px solid #F2CFC8;background:#fff;color:#3B2A20;font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:#FFE3DE;border-color:#FF6F61}
textarea{margin-top:14px;width:100%;height:96px;border-radius:12px;border:1.5px solid #F2CFC8;background:#fff;color:#3B2A20;padding:12px;font:inherit;font-size:16px;resize:none}
textarea:focus{outline:none;border-color:#FF6F61}
.err{font-size:13px;color:#B3261E;min-height:18px;margin:10px 0 0;line-height:1.4}
.gap{height:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbxX7pSicSOMSXSt3oWqiWivCfxcgngBXOnI9XiuQR55Ywy6-KWhW--Q_i3k-lFCLI64/exec';
var CFG = (function () {
  var q = '', k = '', m = 'live', mt;
  try { q = location.search || ''; } catch (e) {}
  mt = /[?&]c=([A-Za-z0-9_-]{1,32})(?:&|$)/.exec(q);
  if (mt) { k = mt[1]; } else {
    mt = /[?&]t=([A-Za-z0-9_-]{1,32})(?:&|$)/.exec(q);
    if (mt) { k = mt[1]; m = 'test'; }
  }
  return { key: k, mode: k ? m : 'invalid' };
})();

var WAIT = ['Under 15 min', '15 to 30 min', '30 to 60 min', '1 to 2 hours', 'Over 2 hours'];
var TOP = ['Pricing', 'Scan or test experience', 'Customer support', 'Other'];
var FL = ['Poor', 'Fair', 'Okay', 'Good', 'Great'];
var MOUTH = ['M9 24 Q16 16 23 24', 'M10 23 Q16 19 22 23', 'M10 22 L22 22', 'M10 20 Q16 25 22 20', 'M9 19 Q16 28 23 19'];
var MSG = 'Couldn’t save your answer. Check your connection and try again.';
var app = document.getElementById('app');

var S = {
  step: 0, ans: {}, topics: [], text: '', rid: '', dev: '', dtype: '',
  initDone: false, init: null, wantStart: false,
  maxStep: 0, busy: false, dirty: false, err: false, retry: null, qTimer: null, tTimer: null,
  submitting: false, adv: null
};

function uuid() {
  var a = new Uint8Array(16), i;
  try { crypto.getRandomValues(a); } catch (e) { for (i = 0; i < 16; i++) a[i] = Math.floor(Math.random() * 256); }
  return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
}
function getDev() {
  var v = '';
  try { v = localStorage.getItem('lf_dev') || ''; } catch (e) {}
  if (!/^[a-f0-9]{32}$/.test(v)) {
    v = uuid();
    try { localStorage.setItem('lf_dev', v); } catch (e) {}
  }
  return v;
}
function getDtype() {
  var u = navigator.userAgent || '';
  if (/android/i.test(u)) return 'Android';
  if (/iphone|ipad|ipod/i.test(u)) return 'iOS';
  if (/windows|macintosh|linux|cros/i.test(u)) return 'Desktop';
  return 'Other';
}
function call(fn, args) {
  return new Promise(function (ok, no) {
    var ctl = null, timer = null;
    try { ctl = new AbortController(); timer = setTimeout(function () { ctl.abort(); }, 25000); } catch (e) {}
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args }),
      credentials: 'omit',
      redirect: 'follow',
      signal: ctl ? ctl.signal : undefined
    }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (j) {
      clearTimeout(timer);
      if (!j || j.ok !== true) throw new Error('api error');
      ok(j.data);
    }).catch(function (e) {
      clearTimeout(timer);
      no(e);
    });
  });
}
function payload() {
  var o = { topics: S.topics.slice(), text: S.text }, k;
  for (k in S.ans) if (S.ans[k] !== undefined) o[k] = S.ans[k];
  return o;
}

/* ---------- saving ---------- */
function setErr(b) {
  S.err = b;
  var el = document.getElementById('sv');
  if (el) el.textContent = b ? MSG : '';
}
function queueSave() {
  S.dirty = true;
  flush();
}
function flush() {
  if (S.busy || !S.dirty) return;
  if (S.ans.q1 === undefined) { S.dirty = false; return; }
  S.busy = true; S.dirty = false;
  call('save', [CFG.key, S.dev, S.dtype, S.rid, payload(), S.maxStep]).then(function (r) {
    S.busy = false;
    if (!r || (r.ok === false && r.code !== 'done')) throw new Error('save failed');
    setErr(false);
    if (S.dirty) flush();
  }).catch(function () {
    S.busy = false; S.dirty = true; setErr(true);
    if (!S.retry) S.retry = setTimeout(function () { S.retry = null; flush(); }, 4000);
  });
}
function later(ms) {
  clearTimeout(S.tTimer);
  S.tTimer = setTimeout(queueSave, ms);
}

/* ---------- navigation ---------- */
function go(n) {
  clearTimeout(S.adv);
  S.step = n;
  if (n >= 1 && n <= 6 && n > S.maxStep) { S.maxStep = n; if (S.ans.q1 !== undefined) queueSave(); }
  render();
  window.scrollTo(0, 0);
}
function back() { if (S.step >= 2) go(S.step - 1); }

function start() {
  if (!S.initDone) { S.wantStart = true; render(); return; }
  S.wantStart = false;
  var r = S.init || {};
  if (r.status === 'done') { go(8); return; }
  if (r.status === 'invalid') { go(9); return; }
  if (r.status === 'resume' && r.responseId) {
    S.rid = r.responseId;
    S.ans = r.answers || {};
    S.topics = (r.answers && r.answers.topics) || [];
    S.text = (r.answers && r.answers.text) || '';
    S.maxStep = r.step || 1;
    go(r.step || 1);
    return;
  }
  go(1);
}

function pick(k, v) {
  S.ans[k] = v;
  queueSave();
  render();
  var at = S.step;
  clearTimeout(S.adv);
  S.adv = setTimeout(function () { if (S.step === at && at < 6) go(at + 1); }, 380);
}

/* ---------- slider ---------- */
function setQ2(i) {
  S.ans.q2 = i;
  var f = document.getElementById('tf'), t = document.getElementById('tt'), trk = document.getElementById('trk');
  if (!f) return;
  var pct = 'calc((100% - 64px) * ' + (i / 4) + ')';
  f.style.width = pct;
  t.style.display = 'block';
  t.style.left = 'calc(32px + ' + pct + ')';
  trk.setAttribute('aria-valuenow', i);
  trk.setAttribute('aria-valuetext', WAIT[i]);
  var d = trk.querySelectorAll('.td'), l = trk.querySelectorAll('.lbl'), j;
  for (j = 0; j < 5; j++) {
    d[j].className = 'td' + (j <= i ? ' on' : '');
    l[j].className = 'lbl' + (j === i ? ' on' : '');
  }
  var e = document.getElementById('er');
  if (e) e.textContent = '';
  later(500);
}
function bindTrk() {
  var t = document.getElementById('trk'), down = false;
  function at(ev) {
    var r = t.getBoundingClientRect();
    var p = (ev.clientX - r.left - 32) / (r.width - 64);
    setQ2(Math.max(0, Math.min(4, Math.round(p * 4))));
  }
  t.onpointerdown = function (ev) { down = true; try { t.setPointerCapture(ev.pointerId); } catch (e) {} at(ev); };
  t.onpointermove = function (ev) { if (down) at(ev); };
  t.onpointerup = function () { down = false; };
  t.onpointercancel = function () { down = false; };
  t.onkeydown = function (ev) {
    var c = S.ans.q2 === undefined ? -1 : S.ans.q2;
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') { setQ2(Math.min(4, c + 1)); ev.preventDefault(); }
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') { setQ2(Math.max(0, c < 0 ? 0 : c - 1)); ev.preventDefault(); }
  };
}
function nextQ2() {
  if (S.ans.q2 === undefined) { document.getElementById('er').textContent = 'Choose how long you waited to continue'; return; }
  clearTimeout(S.tTimer);
  queueSave();
  go(3);
}

/* ---------- Q6 and submit ---------- */
function tog(c, el) {
  var i = S.topics.indexOf(c);
  if (i >= 0) S.topics.splice(i, 1); else S.topics.push(c);
  el.className = 'chip' + (i >= 0 ? '' : ' on');
  el.setAttribute('aria-pressed', i >= 0 ? 'false' : 'true');
  later(600);
}
function txt(el) { S.text = el.value; later(900); }

function submitNow() {
  if (S.submitting) return;
  S.submitting = true;
  clearTimeout(S.tTimer);
  render();
  (function wait() {
    if (S.busy) { setTimeout(wait, 150); return; }
    call('submit', [CFG.key, S.dev, S.dtype, S.rid, payload(), S.maxStep]).then(function (r) {
      S.submitting = false;
      if (r && r.ok) { go(7); return; }
      if (r && r.code === 'done') { go(8); return; }
      throw new Error('submit failed');
    }).catch(function () {
      S.submitting = false; render(); setErr(true);
    });
  })();
}

/* ---------- views ---------- */
function ic(path, size, stroke) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + stroke + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + path + '</svg>';
}
function face(n, sel) {
  var s = '#3B2A20';
  return '<svg width="50" height="50" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="' + (sel ? '#FF6F61' : '#FFE3DE') + '" stroke="#F2CFC8" stroke-width="1"/><circle cx="11" cy="13" r="1.6" fill="' + s + '"/><circle cx="21" cy="13" r="1.6" fill="' + s + '"/><path d="' + MOUTH[n - 1] + '" fill="none" stroke="' + s + '" stroke-width="1.8" stroke-linecap="round"/></svg>';
}
function brand() { return '<div class="brand">TATA 1mg Labs</div>'; }
function banner() { return CFG.mode === 'test' ? '<div class="tb">TEST MODE: responses are saved separately and left out of reports</div>' : ''; }
function head() {
  return '<div class="hd"><div class="hrow">' +
    (S.step >= 2 ? '<button class="bk" aria-label="Back" onclick="back()">' + ic('<path d="M19 12H5M11 6l-6 6 6 6"/>', 22, '#3B2A20') + '</button>' : '') +
    '<span class="lab">Question ' + S.step + ' of 6</span><span>' + Math.round(S.step / 6 * 100) + '%</span></div>' +
    '<div class="bar"><i style="width:' + (S.step / 6 * 100) + '%"></i></div></div>';
}
function sv() { return '<p class="err" id="sv" role="alert">' + (S.err ? MSG : '') + '</p>'; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function faces(k, q, sub) {
  var h = head() + '<h2>' + q + '</h2>' + (sub ? '<p class="sub" style="font-size:14px">' + sub + '</p>' : '') + '<div class="faces">';
  for (var n = 1; n <= 5; n++) {
    h += '<button class="fc' + (S.ans[k] === n ? ' on' : '') + '" aria-label="' + n + ' of 5, ' + FL[n - 1] + '" onclick="pick(\'' + k + '\',' + n + ')">' + face(n, S.ans[k] === n) + '<span>' + FL[n - 1] + '</span></button>';
  }
  return h + '</div>' + sv();
}
function slider() {
  var q = S.ans.q2, h = '<div id="trk" role="slider" tabindex="0" aria-label="Waiting time" aria-valuemin="0" aria-valuemax="4"' +
    (q === undefined ? '' : ' aria-valuenow="' + q + '" aria-valuetext="' + WAIT[q] + '"') + '><div class="tl"></div>' +
    '<div class="tf" id="tf" style="width:' + (q === undefined ? '0' : 'calc((100% - 64px) * ' + (q / 4) + ')') + '"></div>';
  for (var i = 0; i < 5; i++) {
    var l = 'calc(32px + (100% - 64px) * ' + (i / 4) + ')';
    h += '<div class="td' + (q !== undefined && i <= q ? ' on' : '') + '" style="left:' + l + '"></div>';
    h += '<div class="lbl' + (q === i ? ' on' : '') + '" style="left:' + l + '">' + WAIT[i] + '</div>';
  }
  h += '<div class="tt" id="tt" style="display:' + (q === undefined ? 'none' : 'block') + ';left:calc(32px + (100% - 64px) * ' + ((q || 0) / 4) + ')"></div></div>';
  return h;
}

function view() {
  var h = '', n, i;
  switch (S.step) {
    case 0:
      return brand() + '<div class="mid"><div class="ico">' + ic('<path d="M12 21s-7-4.35-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.65-9.5 9-9.5 9z"/>', 30, '#E5503F') +
        '</div><h1>How was your visit?</h1><p class="sub">Six quick questions. It takes under a minute.</p></div>' +
        '<button class="pill" onclick="start()">' + (S.wantStart ? 'Loading…' : 'Start') + '</button>' +
        '<p class="small" style="text-align:center;margin-top:14px">Responses are used only to improve lab services.</p>';
    case 1:
      h = head() + '<h2>How likely are you to recommend this centre to a friend or family member?</h2><div class="nums">';
      for (n = 0; n <= 10; n++) h += '<button class="nb' + (S.ans.q1 === n ? ' on' : '') + '" aria-label="' + n + '" onclick="pick(\'q1\',' + n + ')">' + n + '</button>';
      return h + '</div><div class="ends"><span>0 = Not at all likely</span><span>10 = Extremely likely</span></div>' + sv();
    case 2:
      return head() + '<h2>How long did you wait, from arrival until your test started?</h2>' + slider() +
        '<p class="err" id="er" role="alert"></p>' + sv() + '<button class="pill" onclick="nextQ2()">Next</button>';
    case 3: return faces('q3', 'Was the centre clean and hygienic?');
    case 4: return faces('q4', 'How were the facilities?', 'Drinking water, seating, parking, restrooms');
    case 5: return faces('q5', 'How helpful was the staff?');
    case 6:
      h = head() + '<h2>Anything else you would like to tell us?</h2><p class="sub" style="font-size:14px">Optional</p><div class="chips">';
      for (i = 0; i < TOP.length; i++) {
        var on = S.topics.indexOf(TOP[i]) >= 0;
        h += '<button class="chip' + (on ? ' on' : '') + '" aria-pressed="' + on + '" onclick="tog(\'' + TOP[i] + '\',this)">' + TOP[i] + '</button>';
      }
      return h + '</div><textarea id="tx" maxlength="500" placeholder="Tell us more" aria-label="Tell us more" oninput="txt(this)">' + esc(S.text) + '</textarea>' +
        sv() + '<button class="pill" onclick="submitNow()">' + (S.submitting ? 'Sending…' : 'Submit') + '</button>';
    case 7:
      return brand() + '<div class="mid c"><div class="circ ok" style="background:#FF6F61">' + ic('<path d="M5 12l5 5L20 7"/>', 44, '#fff') + '</div><h1>Thank you.</h1><p class="sub">Your feedback will help us improve our services.</p></div>';
    case 8:
      return brand() + '<div class="mid c"><div class="circ ok" style="background:#FFE3DE">' + ic('<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>', 40, '#E5503F') + '</div><p class="sub" style="font-size:18px;color:#3B2A20">You have already shared your feedback. Thank you for your time.</p></div>';
    default:
      return brand() + '<div class="mid c"><p class="sub" style="font-size:18px;color:#3B2A20">This link is not active.</p></div>';
  }
}

function render() {
  app.innerHTML = '<div class="scr">' + banner() + view() + '</div>';
  if (S.step === 2) bindTrk();
}

/* ---------- boot ---------- */
S.dev = getDev();
S.dtype = getDtype();
S.rid = uuid();
if (CFG.mode === 'invalid') {
  S.step = 9;
  render();
} else {
  render();
  call('init', [CFG.key, S.dev]).then(function (r) {
    S.init = r || { status: 'new' }; S.initDone = true;
    var was = CFG.mode;
    if (r && (r.mode === 'test' || r.mode === 'live')) CFG.mode = r.mode;
    if (r && r.status === 'invalid') { S.step = 9; render(); return; }
    if (S.step === 0 && !S.wantStart && was !== CFG.mode) render();
    if (S.wantStart) start();
  }).catch(function () {
    S.init = { status: 'new' }; S.initDone = true;
    if (S.wantStart) start();
  });
}
</script>
</body>
</html>
